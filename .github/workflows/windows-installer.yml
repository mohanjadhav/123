name: Build Windows installer

# Builds RapidLabels-Setup.exe on a free GitHub Windows machine:
#  - automatically on every push to main
#  - manually: Actions tab -> "Build Windows installer" -> "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # publish the installer as a GitHub Release
  id-token: write      # build-provenance attestation (proves the file was built from this repository)
  attestations: write

env:
  MONGODB_VERSION: "7.0.14"
  HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontend - build the app screens
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          corepack enable
          cd frontend
          yarn install --frozen-lockfile
          yarn build
        shell: bash

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r desktop/requirements.txt

      - name: Bundle MongoDB (private database)
        shell: pwsh
        run: |
          $zip = "mongodb.zip"
          Invoke-WebRequest "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$env:MONGODB_VERSION.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath mongo_tmp
          New-Item -ItemType Directory -Force desktop/build/mongodb | Out-Null
          Copy-Item (Get-ChildItem mongo_tmp -Recurse -Filter mongod.exe | Select-Object -First 1).FullName desktop/build/mongodb/
          Get-ChildItem mongo_tmp -Recurse -Filter LICENSE* | Select-Object -First 1 | Copy-Item -Destination desktop/build/mongodb/

      - name: Version info (used by the "new version available" check)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          '{"version": "1.0.${{ github.run_number }}", "repo": "${{ github.repository }}"}' | Set-Content -Encoding utf8NoBOM desktop/build/app.json
          # Windows file details (Properties > Details): publisher, product, version
          $v = "1.0.${{ github.run_number }}.0"; $t = "(1, 0, ${{ github.run_number }}, 0)"
          (Get-Content desktop/version_info.template.txt) -replace '__VERSION__', $v -replace '__TUPLE__', $t | Set-Content -Encoding utf8 desktop/build/version_info.txt

      - name: Package RapidLabels.exe
        run: pyinstaller desktop/rapid_labels.spec --noconfirm

      - name: Smoke test (starts database + server, checks the API answers)
        shell: pwsh
        run: |
          $p = Start-Process dist/RapidLabels/RapidLabels.exe -ArgumentList "--serve-only" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:47811/api/templates -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          $home_ = Invoke-WebRequest http://127.0.0.1:47811/ -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:LOCALAPPDATA/RapidLabels/logs/app.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $ok -or $home_.Content -notmatch "RAPID LABELS") { throw "Smoke test failed" }
          Write-Host "Smoke test passed: API and app screen respond"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" desktop/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # Optional code signing: add repository secrets WINDOWS_CERT_PFX (base64 of your .pfx) and
      # WINDOWS_CERT_PASSWORD to remove the "unknown publisher" warning. Skipped when not set.
      - name: Sign installer (only if a certificate is configured)
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match "x64" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 desktop/Output/RapidLabels-Setup.exe
          Remove-Item cert.pfx

      - name: Checksum (SHA-256)
        shell: pwsh
        run: |
          $h = (Get-FileHash desktop/Output/RapidLabels-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  RapidLabels-Setup.exe" | Set-Content -Encoding ascii desktop/Output/RapidLabels-Setup.exe.sha256
          Write-Host "SHA-256: $h"

      - name: Prove where the installer came from (GitHub attestation)
        # free for public repositories; private repositories on free plans skip this without failing the build
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: desktop/Output/RapidLabels-Setup.exe

      - name: Upload installer (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RapidLabels-Setup
          path: desktop/Output/RapidLabels-Setup.exe

      - name: Publish release (easy download page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RAPID LABELS v1.0.${{ github.run_number }}
          body: |
            Download **RapidLabels-Setup.exe** below, double-click it and follow the steps.
            Windows 10 (1809+) / Windows 11, 64-bit. Your labels are saved in %LOCALAPPDATA%\RapidLabels.

            **Is it safe?** This file was built automatically by GitHub from this repository's code
            (see the "Attestations" / provenance badge on the Actions run), and its SHA-256 checksum is
            in `RapidLabels-Setup.exe.sha256`. If Windows SmartScreen says "unknown publisher",
            click **More info → Run anyway** (the app is not code-signed with a paid certificate).
          files: |
            desktop/Output/RapidLabels-Setup.exe
            desktop/Output/RapidLabels-Setup.exe.sha256
          make_latest: true
